# QNM Analyser — Traefik dynamic configuration
# Author: Dr. Denys Dutykh (https://www.denys-dutykh.com/)
#
# Install:
#   sudo ./deploy/install-traefik.sh
# which copies this file to /etc/traefik/dynamic/qnm-analyser.yml
#
# IMPORTANT: QNM routers must live ONLY in this file. The shared
# /etc/traefik/dynamic/routes.yml must NOT define qnm-anal-* routers or
# services, or Traefik keeps the old ones and skips the new services.
#
# Two routers share one service on purpose:
#   qnm-anal-assets   static assets only   (long-lived immutable cache)
#   qnm-anal          the Dash application (no-store — never cache HTML/API)
#   qnm-anal-webhook  GitHub deploy hook   (no-store, tighter rate limit)
#
# Why the split: a long-lived Cache-Control middleware on the application
# router also stamps Traefik's own 503 "no available server" page. A visitor
# who arrives during an outage then pins that error for max-age, and
# immutable suppresses revalidation even on a normal reload.

http:
  routers:
    # Static assets — safe to cache hard. Priority beats the app router.
    # Rule MUST be a single line: Traefik's rule parser rejects newlines.
    qnm-anal-assets:
      rule: "(Host(`qnm-anal.denys-dutykh.com`) || Host(`www.qnm-anal.denys-dutykh.com`)) && (PathPrefix(`/assets/`) || PathPrefix(`/_dash-component-suites/`) || PathPrefix(`/_favicon.ico`))"
      priority: 100
      entryPoints:
        - websecure
      service: qnm-anal-service
      middlewares:
        - qnm-security-headers
        - qnm-cache-static
        - qnm-compress
      tls:
        certResolver: letsencrypt

    # Application — never long-cache. Covers HTML, callbacks, health, uploads.
    qnm-anal:
      rule: "Host(`qnm-anal.denys-dutykh.com`) || Host(`www.qnm-anal.denys-dutykh.com`)"
      priority: 10
      entryPoints:
        - websecure
      service: qnm-anal-service
      middlewares:
        - qnm-security-headers
        - qnm-no-store
        - qnm-body-limit
        - qnm-ratelimit
        - qnm-compress
      tls:
        certResolver: letsencrypt

    # GitHub deploy webhook
    qnm-anal-webhook:
      rule: "(Host(`qnm-anal.denys-dutykh.com`) || Host(`www.qnm-anal.denys-dutykh.com`)) && PathPrefix(`/webhook`)"
      priority: 200
      entryPoints:
        - websecure
      service: qnm-webhook-service
      middlewares:
        - qnm-security-headers
        - qnm-no-store
        - qnm-webhook-ratelimit
      tls:
        certResolver: letsencrypt

  services:
    qnm-anal-service:
      loadBalancer:
        passHostHeader: true
        servers:
          # Explicit IPv4. "localhost" prefers [::1] on this host; gunicorn
          # listens on IPv4 only, so Traefik would mark the backend down.
          - url: "http://127.0.0.1:8050"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    qnm-webhook-service:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9050"
        healthCheck:
          path: /webhook/health
          interval: 30s
          timeout: 3s

  middlewares:
    qnm-security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          X-XSS-Protection: "0"
          Server: ""
          X-Powered-By: ""
          # App loads zero external scripts (MathJax v3 is bundled by Dash).
          # unsafe-inline still required for Dash bootstrap + Plotly styles.
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
          Permissions-Policy: "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=(), fullscreen=(self)"

    qnm-cache-static:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=31536000, immutable"

    qnm-no-store:
      headers:
        customResponseHeaders:
          Cache-Control: "no-store, must-revalidate"

    qnm-body-limit:
      buffering:
        maxRequestBodyBytes: 10485760
        memRequestBodyBytes: 2097152

    qnm-ratelimit:
      rateLimit:
        average: 60
        burst: 120
        period: 1m

    qnm-webhook-ratelimit:
      rateLimit:
        average: 10
        burst: 20
        period: 1m

    qnm-compress:
      compress: {}
